# =====================================================================
#  T-MPC++ planner parameters
#  Topology-driven Model Predictive Control (de Groot et al., IEEE T-RO
#  vol.41 2025). Benchmark method id: M6_tmpc, display name "T-MPC++".
#
#  All keys live under the "tmpc" namespace. This file is loaded by
#  autonomous_flight/launch/tmpc_demo.launch and consumed by
#  trajPlanner::tmpcPlanner / AutoFlight::tmpcNavigation.
#
#  Design notes: see trajectory_planner/docs/TMPC_INTEGRATION.md
# =====================================================================
tmpc:
  # -- Horizon / local goal range -------------------------------------
  dt: 0.05
  horizon_steps: 50              # 2.5 s at dt=0.05, enough for a 5 m local goal at 2 m/s

  # -- Lap geometry (UAV flies the lap at a fixed altitude) ------------
  z_lap: 1.0                     # [m] horizontal-plane altitude for guidance + z_ref
  r_uav: 0.30                    # [m] robot disc radius

  # -- Guidance planner (Visibility-PRM + homotopy) -------------------
  num_trajectories_P: 4          # P topology-distinct guidance trajectories, matching the paper-style multi-branch search
  add_unguided_planner: true     # true = T-MPC++ (extra non-guided MPC in parallel)
  prm_samples_n: 100             # Guard/Connector sample budget for the internal Visibility-PRM
  homotopy_method: "h_signature" # h_signature | winding | uvd
  visibility_dt: 0.20            # [s] time resolution for (x,y,t) visibility checks
  smoothing_resolution: 0.05     # [s] cubic-spline resampling of guidance trajectories

  # -- Goal grid along the reference path (Frenet placement) ----------
  goal_grid_lat: 7               # lateral goal/sample count (across ref normal); denser = more classes
  goal_grid_long: 3              # longitudinal goal count (along ref progress)
  goal_lat_spread: 3.5           # [m] total lateral sampling/goal coverage. Was 2.0 -> only +-1.0 m
                                 # around the reference, too narrow to route around obstacles.
  goal_long_distance: 5.0        # [m] far local PRM/MPC goal, roughly sensor/FOV scale

  # -- Local planners (parallel OSQP MPC) ----------------------------
  beta_relax: 1.0                # homotopy half-plane scale for Eq. 9e.
                                 # Eq. 9d collision clearance is added separately in
                                 # the local MPC as a soft linearized constraint.
  safety_margin: 0.25            # extra clearance [m] beyond r_uav + r_obs (linearization buffer)
  parallel_threads: 3            # leave CPU headroom for Gazebo/RViz/detector callbacks
  thread_timeout_ms: 35          # per-branch OSQP cap; whole plan also includes PRM + matrix setup
  solve_sequential: false        # false = solve branches in parallel (OpenMP). true = single-thread.
  fail_hold_time: 0.35           # [s] keep the last good trajectory through brief replanning misses
  brake_time: 0.45               # [s] smooth braking fallback if no feasible branch exists
  receding_horizon_max_playback_time: 0.20 # [s] do not play an old nominal MPC trajectory to its end

  # -- Static map avoidance ------------------------------------------
  use_static_astar: false         # A* not used: the topology PRM itself must find the route around
                                  # static + dynamic obstacles (wider sampling + track the PRM path,
                                  # not the straight lap reference).
  static_astar_step: 0.20         # [m] A* grid resolution
  static_astar_pool_xy: 80        # cells per x/y dimension in the local A* pool
  static_astar_pool_z: 16         # cells in z dimension in the local A* pool
  static_halfplane_search_radius: 0.8 # [m] scan radius around guidance for static half-planes
  static_halfplane_clearance: 0.25    # [m] extra half-plane margin; map is already inflated
  static_halfplane_rays: 16       # angular samples for local static half-plane constraints
  static_post_check_clearance: 0.25 # [m] extra static clearance used by PRM, post-check, and execution guard
  static_fov_range: 7.0             # [m] only consider static obstacles within this range of the drone
                                    # (FOV-consistent with dynamic; mirrors map raycast_max_length)

  # -- Decision making (Eq.12 consistency) ---------------------------
  consistency_ci: 0.75           # weight preferring the previously-executed homotopy class

  # -- Local MPC cost weights (same cost as baseline MPC; only tuning) -
  cost_weights:
    w_contour: 1.0               # lateral (contour) path-following error
    w_lag:     1.0               # longitudinal (lag) path-following error
    w_vel:     0.1               # reference-velocity tracking
    w_omega:   0.05              # yaw-rate input
    w_acc:     0.05              # acceleration input

  # -- Kinematic limits (aligned with all other methods) -------------
  v_max: 2.0                     # horizontal speed limit [m/s]
  a_max: 3.0                     # horizontal accel limit [m/s^2]
  vz_max: 1.0                    # vertical speed limit [m/s]
  az_max: 2.0                    # vertical accel limit [m/s^2]
  v_ref: 2.0                     # reference cruise speed [m/s]

  # -- 3-D vertical avoidance (UAV) ----------------------------------
  #   Off by default because the paper/Open-source T-MPC++ topology planner is
  #   2-D in (x,y,t). Turn on only for UAV-specific fly-over experiments.
  enable_vertical_avoidance: false
  vertical_clearance: 0.4        # [m] required clearance above an obstacle's top

  # -- Obstacle prediction interface ---------------------------------
  #   constant_velocity : propagate detector pose+vel linearly (paper-faithful, DEFAULT)
  #   intent_mean       : highest-probability intent mode mean (future second table)
  #   gt                : ground-truth future (algorithm upper bound)
  prediction_source: "constant_velocity"
  prediction_horizon_s: 2.5      # = horizon_steps * dt
  max_obstacles: 8               # nearest-N obstacles considered (fewer = faster QP; paper uses 12)

  # -- RViz/debug publishing ------------------------------------------
  visualization_period: 0.5      # [s] debug path publishing; bbox obstacles come from detector topics
  publish_guidance_markers: true # lightweight topology paths (/tmpc/guidance_paths)
  publish_optimized_markers: true  # show MPC branches too; needed to compare guidance vs optimized tracking
  publish_obstacle_prediction_markers: false
  publish_visible_static_markers: true
  visible_static_marker_stride: 1 # publish every Nth local 3D static voxel in /tmpc/visible_static_obstacles
  visible_static_marker_max_points: 20000
  visible_static_z_min: -0.1      # RViz local-static z crop; match dynamic_map/ground_height
  visible_static_z_max: 2.5       # RViz local-static z crop; match dynamic_map/max_height_visualization
