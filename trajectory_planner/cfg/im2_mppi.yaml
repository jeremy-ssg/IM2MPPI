# =====================================================================
#  IM2-MPPI planner parameters (Phases 1 – 4, incl. CVaR)
#  All keys live under the "im2_mppi" namespace.
# =====================================================================
im2_mppi:
  # ── Dynamics / horizon ──────────────────────────────────────────────
  dt: 0.05                  # simulation timestep [s]
  horizon_steps: 38         # OFAT sweep trial 152: best balance (Time 41.8s, MinClr 0.492, CR=0)

  # ── Sampling ────────────────────────────────────────────────────────
  num_rollouts: 512         # N parallel trajectory samples
  num_modes_per_obstacle: 4 # K intent modes per obstacle (predictor side)
  num_joint_modes_keep: 4   # Kbar retained joint modes after pruning

  # ── MPPI temperature ────────────────────────────────────────────────
  lambda: 5.0               # cost-to-weight sharpness; lower = greedier

  # ── Safety geometry ─────────────────────────────────────────────────
  d_safe: 0.5               # soft-cost clearance threshold
  sigma_risk: 1.0           # preliminary-risk scale: exp(-d_min / sigma_risk)
  sigma_min: 0.0            # ↓ from 0.05 — let CVaR gracefully degrade to 0 when
                            # predictor reports zero uncertainty (deterministic obstacle).
                            # A nonzero floor was injecting synthetic noise that made
                            # M4 underperform its no-CVaR ablation in deterministic scenes.
  hard_floor_clearance: 0.0 # KEEP 0 — values > 0.2 cause drone to freeze: all rollouts
                            # rejected, MPPI falls back to stale nominal, drone exhausts
                            # the old trajectory and hovers. The sweep showed MinClr goes
                            # NEGATIVE at hard_floor > 0.2. Confirmed in flight: latter-half
                            # freeze + dynamic obstacles disappearing from RViz.

  # ── Kinematic constraints ───────────────────────────────────────────
  v_max: 2.0                # max velocity norm [m/s]
  a_max: 3.0                # max acceleration norm [m/s²]

  # ── Control noise std-dev per axis [m/s²] ───────────────────────────
  sigma_ax: 0.8
  sigma_ay: 0.8
  sigma_az: 0.8    # ↑ from 0.3 — match xy noise so MPPI explores vertical escape

  # ── Cost weights ────────────────────────────────────────────────────
  w_goal:   10.0
  w_path:    1.0
  w_vel:     0.1
  w_acc:     0.05
  w_jerk:    0.2             # ↑ from 0.05 — penalise jerk more, smoother control
  w_static: 30.0
  w_dyn:    30.0             # ↓ from 50.0 — sweet spot (better Time/Length/Jerk, same safety)

  # ── Method selection (ablation) ─────────────────────────────────────
  #   vanilla_mppi         : baseline, ignores dynamic predictions
  #   mean_prediction_mppi : nav layer compresses K modes -> 1 mean per obstacle
  #   mode_aware_mppi      : full multi-modal (Cartesian product + prune)
  #   cvar_mppi            : multi-modal + CVaR tail aggregation (Phase 4)
  #   dra_mppi             : DRA-MPPI-style joint collision probability baseline
  method_type: "cvar_mppi"

  # probability | risk_aware
  mode_pruning_type: "risk_aware"

  # ── CVaR (Phase 4) ──────────────────────────────────────────────────
  # Per-rollout CVaR over OBSTACLE prediction uncertainty.
  # For each (ego rollout, joint mode, obstacle):
  #   sample R obstacle trajectories from N(mu, diag(sigma^2)),
  #   compute hinge-squared loss per sample,
  #   take the mean of the worst-α fraction.
  #   This scalar enters the MPPI cost via lambda_r.
  cvar_alpha: 0.20                # tail fraction (worst 20%)
  cvar_num_obstacle_samples: 16   # R: obstacle Monte-Carlo samples per (i,m,j)
  cvar_lambda_r: 5.0              # weight on Σ_j ρ in the per-rollout cost

  # DRA-MPPI baseline (Trevisan et al., IROS 2025 style).
  # Used only when method_type == "dra_mppi".
  dra_num_mc_samples: 128
  dra_cp_lambda: 200.0
  dra_cp_threshold: 0.05
  dra_hard_penalty: 50000.0
  dra_robot_radius: 0.35
  dra_sigma_floor: 0.25
  dra_use_z_probability: true

  # ── Mode fusion (Phase 4) ───────────────────────────────────────────
  # How joint-mode posteriors π_m enter the MPPI free-energy update:
  #   soft       : standard Proposition 1 (use π_m directly)
  #   sharpened  : π_m^γ normalized,  γ = fusion_gamma (fixed)
  #   adaptive   : soft posterior with risk-aware boost for high-cost modes
  #   argmax     : one-hot — picks argmax_m π_m·Σ_i exp(−S_{m,i}/λ)
  # adaptive keeps a soft posterior and boosts retained joint modes whose
  # rollout cost is worse than the posterior mean.
  fusion_mode: "adaptive"
  fusion_gamma: 2.0               # used only when fusion_mode == sharpened
  fusion_kappa: 2.0               # legacy entropy coefficient (not used by risk-aware adaptive)
  fusion_risk_beta: 1.0           # adaptive risk boost slope
  fusion_risk_boost_max: 3.0      # cap for per-mode risk boost

  # ── Visualization (RViz) ────────────────────────────────────────────
  viz_num_rollouts: 20        # how many rollouts to draw as line strips
  viz_color_by_weight: true   # true: red(low)->green(high); false: flat

  # ── GPU acceleration ────────────────────────────────────────────────
  # use_gpu: true requires the binary to be built with IM2_MPPI_USE_CUDA.
  # Falls back to CPU automatically if no CUDA device is present.
  # CUDA handles rollout/AABB costs; voxel-map collision is added on CPU from downloaded states.
  use_gpu: true
  cuda_device: 0

  # ── Misc ────────────────────────────────────────────────────────────
  random_seed: 42
  use_yaw_postprocess: true
  v_yaw_min: 0.3
