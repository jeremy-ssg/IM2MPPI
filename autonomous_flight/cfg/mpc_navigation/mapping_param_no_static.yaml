sensor_input_mode: 0
localization_mode: 1
depth_image_topic: /no_topic
pose_topic: /CERLAB/quadcopter/pose
odom_topic: /CERLAB/quadcopter/odom

robot_size: [0.5, 0.5, 0.3]

